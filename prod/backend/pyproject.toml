[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-damage-segmentation"
version = "0.1.0"
description = "Recall-oriented exterior vehicle damage segmentation with commercial-use provenance gates."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "scipy>=1.13,<2",
  "timm>=1.0,<2",
  "torch>=2.3",
  "torchvision>=0.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.27,<1",
]
serve = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"]

[project.scripts]
vehicle-damage = "vehicle_damage.cli:main"
vehicle-damage-api = "vehicle_damage.api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
